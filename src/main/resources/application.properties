spring.application.name=employee-ingestion-platform

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/employee_db}
spring.datasource.username=${DB_USERNAME:employee_user}
spring.datasource.password=${DB_PASSWORD:employee_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Spring Batch
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# File upload
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}

# Server
server.port=${SERVER_PORT:8080}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Application upload settings
app.upload.directory=${UPLOAD_DIRECTORY:./data/uploads}
app.upload.scheduler-delay-ms=${UPLOAD_SCHEDULER_DELAY_MS:300000}
app.upload.scheduler-initial-delay-ms=${UPLOAD_SCHEDULER_INITIAL_DELAY_MS:10000}
app.upload.chunk-size=${BATCH_CHUNK_SIZE:500}

# Application Kafka settings
app.kafka.employee-topic=${EMPLOYEE_TOPIC:employee-events}
app.kafka.dead-letter-topic=${EMPLOYEE_DLT_TOPIC:employee-events.DLT}

# JWT
app.jwt.secret=${JWT_SECRET:change-this-local-development-secret-key-123456789}
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:60}

# Logging with correlation ID
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n

# Initial local users
app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:Admin@123}
app.security.user.username=${APP_USER_USERNAME:user}
app.security.user.password=${APP_USER_PASSWORD:User@123}

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Kafka consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:employee-ingestion-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

# Kafka producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs