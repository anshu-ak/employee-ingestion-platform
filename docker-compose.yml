services:
  postgres:
    image: postgres:17.11-alpine
    container_name: employee-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-employee_db}"
      POSTGRES_USER: "${POSTGRES_USER:-employee_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-employee_password}"
    ports:
      - "5432:5432"
    volumes:
      - employee_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U employee_user -d employee_db
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.1.1
    container_name: employee-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: "CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3

  application:
    build:
      context: .
      dockerfile: Dockerfile
    image: employee-ingestion-platform:local
    container_name: employee-application
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

    environment:
      DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-employee_db}"
      DB_USERNAME: "${POSTGRES_USER:-employee_user}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-employee_password}"

      KAFKA_BOOTSTRAP_SERVERS: "kafka:19092"
      KAFKA_GROUP_ID: "${KAFKA_GROUP_ID:-employee-ingestion-group}"

      UPLOAD_DIRECTORY: "/app/data/uploads"

      JWT_SECRET: "${JWT_SECRET:-safe-local-development-secret-key-123456789}"
      JWT_EXPIRY_MINUTES: "${JWT_EXPIRY_MINUTES:-60}"

      SERVER_PORT: 8080

    ports:
      - "8080:8080"

    volumes:
      - ./data/uploads:/app/data/uploads

volumes:
  employee_postgres_data: